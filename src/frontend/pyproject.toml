[project]
name = "study-tracker-frontend"
version = "0.0.0"
description = "Frontend for DevOps Study Tracker application"
readme = "README.md"
authors = [{ name = "Tomas Buchta", email = "test@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "flask>=3.1.3",
  "requests>=2.34.2",
  "ruff>=0.16.3",
  "pytest>=9.1.1",
  "responses>=0.26.2",
]

[project.scripts]
study-tracker-frontend = "frontend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
